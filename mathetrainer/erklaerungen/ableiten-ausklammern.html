<style>
/* Eine Tafel mit Zeilen, die Schritt für Schritt entstehen. Darunter die Erklärung und die Steuerung. Farben wie im Ableitungstrainer. */
:root{
  --bg:#FFFFFF; --ink:#16181D; --muted:#6B717C; --line:#E5E7EB; --soft:#F3F4F6; --soft-hover:#E8EAEE;
  --accent:#2F55D4; --on-ink:#FFFFFF;
  --u:#2F55D4; --v:#13804F; --ok:#22A05A; --n:#C2410C; --hl:#FCE7A8;

}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#111317;--ink:#ECEEF2;--muted:#9AA1AD;--line:#272B32;--soft:#1B1E24;--soft-hover:#252930;
    --accent:#8AA5FF;--on-ink:#111317;
    --u:#8AA5FF;--v:#4CC38A;--ok:#3BBF73;--n:#FB923C;--hl:#4D3F12;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111317;--ink:#ECEEF2;--muted:#9AA1AD;--line:#272B32;--soft:#1B1E24;--soft-hover:#252930;
  --accent:#8AA5FF;--on-ink:#111317;
  --u:#8AA5FF;--v:#4CC38A;--ok:#3BBF73;--n:#FB923C;--hl:#4D3F12;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;
  padding-block:28px 40px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
main{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{margin:0;font-size:19px;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
.lead{margin:0;color:var(--muted);font-size:14.5px;max-width:60ch}
.part{margin:0;font-size:16px;font-weight:600}
.board{position:relative;border:1.5px solid var(--line);border-radius:12px;padding:18px 18px 22px;min-height:340px;display:flex;flex-direction:column;gap:6px;overflow:hidden}
.row{font-size:22px;min-height:46px;display:flex;align-items:center;gap:12px;overflow-x:auto;overflow-y:hidden;padding:2px 0}
.row.small{font-size:17px;color:var(--muted);min-height:36px}
.row.side{font-size:18px;flex-direction:column;align-items:flex-start;gap:0;padding-block:0;min-height:0;margin-top:-16px}
.row.side + .row.side{margin-top:0}
.row.side + .row:not(.side){margin-top:6px}
.row .lbl{font-size:13px;color:var(--muted);white-space:nowrap;font-family:var(--font)}
.row mjx-container{flex:none}
.check{flex:none;width:1.7em;height:1.7em;margin-left:6px}
.check path{fill:none;stroke:var(--ok);stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:30;stroke-dashoffset:0}
.check.draw path{animation:draw .55s .25s ease-out both}
@keyframes draw{from{stroke-dashoffset:30}to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.check.draw path{animation:none}}
.flyer{position:absolute;left:0;top:0;pointer-events:none;z-index:5;white-space:nowrap}
.cu{color:var(--u);fill:var(--u)}
.cv{color:var(--v);fill:var(--v)}
.cn{color:var(--n);fill:var(--n)}
.caption{font-size:16.5px;min-height:76px;max-width:62ch;margin:0;background:var(--soft);border-radius:14px;padding:16px 20px;transform-origin:50% 50%}
.caption mjx-container{font-size:105%}
.controls{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}
.count{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums;text-align:center;white-space:nowrap}
.btn{height:50px;border-radius:12px;font:600 15px var(--font);cursor:pointer;border:1.5px solid var(--line);background:transparent;color:var(--ink);padding:0 16px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.btn.primary:hover{opacity:.88}
.btn:disabled{opacity:.4;cursor:default}
.textlink{background:none;border:0;padding:0;color:var(--muted);font:inherit;font-size:13.5px;text-decoration:underline;cursor:pointer;justify-self:center}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:520px){
  .board{padding:14px 10px 18px;min-height:300px}
  .row{font-size:clamp(13px,3.6vw,17px);min-height:36px}
  .row.side{font-size:clamp(13px,3.7vw,15px);margin-top:-8px}
  .row.small{font-size:14.5px}
}

<script>
/* ================= Bausteine für die Formeln ================= */
let C={};
function readColors(){ const s=getComputedStyle(document.documentElement); C={hl:s.getPropertyValue('--hl').trim()||'#FCE7A8'}; }
const U=t=>'\\class{cu}{'+t+'}';
const V=t=>'\\class{cv}{'+t+'}';
const N=t=>'\\class{cn}{'+t+'}';
const T=(n,t)=>'\\class{t-'+n+'}{'+t+'}';
const HL=t=>'\\bbox['+C.hl+',3px]{'+t+'}';
const E='e^{-x}';
const M1=N('(-1)');

/* ================= Schritte =================
   rows: vollständiger Tafelinhalt. Eine Zeile mit gleicher id bleibt stehen.
   fly: Teilterme, die von einer markierten Stelle zur nächsten wandern (Quelle und Ziel über \class{t-…}). */
const P1=()=>({id:'p', tex:"f'(x)=3\\cdot "+HL(V(E))+'+'+U('(3x+4)')+'\\cdot '+M1+'\\cdot '+HL(V(E))});
const K1=()=>({id:'k1', tex:'='+HL(V(E))+'\\cdot(3+\\class{t-ub}{\\underbrace{'+U('(3x+4)')+'\\cdot '+M1+'}_{}})'});
const P2=()=>({id:'p2', tex:"f''(x)=-3\\cdot "+HL(V(E))+'+'+U('(-3x-1)')+'\\cdot '+M1+'\\cdot '+HL(V(E))});
const K2=()=>({id:'k21', tex:'='+HL(V(E))+'\\cdot(-3+\\class{t-ub}{\\underbrace{'+U('(-3x-1)')+'\\cdot '+M1+'}_{}})'});
const STEPS=[
 {part:'Erste Ableitung', cap:'Gegeben ist $f(x)=(3x+4)\\cdot e^{-x}$. Gesucht sind $f\'(x)$ und $f\'\'(x)$.',
  rows:()=>[{id:'f', tex:'f(x)='+T('fu',U('(3x+4)'))+'\\cdot '+T('fv',V(E))}]},
 {part:'Erste Ableitung', cap:'Zerlege f in zwei Faktoren. $u$ ist der Teil vor dem e-Term, $v$ ist der e-Term.',
  rows:()=>[{id:'f', tex:'f(x)='+T('fu',U('(3x+4)'))+'\\cdot '+T('fv',V(E))},
            {id:'uv', tex:'u(x)='+T('u',U('3x+4'))+'\\qquad v(x)='+T('v',V(E))}],
  fly:[{from:'fu', to:'u', tex:()=>U('3x+4')},{from:'fv', to:'v', tex:()=>V(E)}]},
 {part:'Erste Ableitung', cap:'Leite beide ab. Für $v\'$ brauchst du die Kettenregel: Die innere Ableitung von $-x$ ist $-1$. Schreib sie als Faktor $(-1)$ aus, dann geht sie später nicht verloren.',
  rows:()=>[{id:'f', tex:'f(x)='+U('(3x+4)')+'\\cdot '+V(E)},
            {id:'uv', tex:'u(x)='+T('u',U('3x+4'))+'\\qquad v(x)='+T('v',V(E))},
            {id:'d', tex:"u'(x)="+T('up',U('3'))+"\\qquad v'(x)="+T('vp',M1+'\\cdot '+V(E))}]},
 {part:'Erste Ableitung', cap:'Setz in die Produktregel $u\'\\cdot v+u\\cdot v\'$ ein.',
  rows:()=>[{id:'f', tex:'f(x)='+U('(3x+4)')+'\\cdot '+V(E)},
            {id:'uv', tex:'u(x)='+T('u',U('3x+4'))+'\\qquad v(x)='+T('v',V(E))},
            {id:'d', tex:"u'(x)="+T('up',U('3'))+"\\qquad v'(x)="+T('vp',M1+'\\cdot '+V(E))},
            {id:'p', tex:"f'(x)="+T('a',U('3'))+'\\cdot '+T('b',V(E))+'+'+T('c',U('(3x+4)'))+'\\cdot '+T('dd',M1+'\\cdot '+V(E))}],
  fly:[{from:'up',to:'a',tex:()=>U('3')},{from:'v',to:'b',tex:()=>V(E)},{from:'u',to:'c',tex:()=>U('(3x+4)')},{from:'vp',to:'dd',tex:()=>M1+'\\cdot '+V(E)}]},
 {part:'Erste Ableitung', cap:'Beide Summanden enthalten den Faktor $e^{-x}$.',
  rows:()=>[{id:'f', tex:'f(x)='+U('(3x+4)')+'\\cdot '+V(E)},
            {id:'uv', tex:'u(x)='+U('3x+4')+'\\qquad v(x)='+V(E)},
            {id:'d', tex:"u'(x)="+U('3')+"\\qquad v'(x)="+M1+'\\cdot '+V(E)},
            {id:'p', tex:"f'(x)="+T('s1',U('3'))+'\\cdot '+T('e1',HL(V(E)))+'+'+T('s2',U('(3x+4)')+'\\cdot '+M1)+'\\cdot '+T('e2',HL(V(E)))}]},
 {part:'Erste Ableitung', cap:'Klammere $e^{-x}$ aus. Er steht danach nur noch einmal vor der Klammer. In die Klammer kommt, was von jedem Summanden übrig bleibt.',
  rows:()=>[{id:'f', tex:'f(x)='+U('(3x+4)')+'\\cdot '+V(E)},
            {id:'uv', tex:'u(x)='+U('3x+4')+'\\qquad v(x)='+V(E)},
            {id:'d', tex:"u'(x)="+U('3')+"\\qquad v'(x)="+M1+'\\cdot '+V(E)},
            {id:'p', tex:"f'(x)="+T('s1',U('3'))+'\\cdot '+T('e1',HL(V(E)))+'+'+T('s2',U('(3x+4)')+'\\cdot '+M1)+'\\cdot '+T('e2',HL(V(E)))},
            {id:'k1', tex:'='+T('E',HL(V(E)))+'\\cdot\\left('+T('r1',U('3'))+'+'+T('r2',U('(3x+4)')+'\\cdot '+M1)+'\\right)'}],
  fly:[{from:'e1',to:'E',tex:()=>HL(V(E))},{from:'e2',to:'E',tex:()=>HL(V(E))},{from:'s1',to:'r1',tex:()=>U('3')},{from:'s2',to:'r2',tex:()=>U('(3x+4)')+'\\cdot '+M1}]},
 {part:'Erste Ableitung', cap:'Den Teil unter der Klammer rechnest du in einer Nebenrechnung aus.',
  rows:()=>[P1(), K1()]},
 {part:'Erste Ableitung', cap:'Multipliziere aus: Jeder Summand in der Klammer wird mit $(-1)$ multipliziert.',
  rows:()=>[P1(), K1(), {id:'ma', side:true, label:true, tex:'=3x\\cdot '+M1+'+4\\cdot '+M1}]},
 {part:'Erste Ableitung', cap:'Mal $(-1)$ dreht das Vorzeichen um: aus $3x$ wird $-3x$, aus $4$ wird $-4$.',
  rows:()=>[P1(), K1(), {id:'ma', side:true, label:true, tex:'=3x\\cdot '+M1+'+4\\cdot '+M1}, {id:'mb', side:true, tex:'='+T('m1','-3x-4')}]},
 {part:'Erste Ableitung', cap:'Setz das Ergebnis in die Klammer ein.',
  rows:()=>[P1(), K1(), {id:'ma', side:true, label:true, tex:'=3x\\cdot '+M1+'+4\\cdot '+M1}, {id:'mb', side:true, tex:'='+T('m1','-3x-4')},
            {id:'k2', tex:'='+V(E)+'\\cdot\\left(3'+T('m2','-3x-4')+'\\right)'}],
  fly:[{from:'m1',to:'m2',tex:()=>'-3x-4'}]},
 {part:'Erste Ableitung', cap:'Fasse zusammen: $3-4=-1$. Damit ist $f\'(x)=e^{-x}\\cdot(-3x-1)$.',
  rows:()=>[P1(), K1(), {id:'ma', side:true, label:true, tex:'=3x\\cdot '+M1+'+4\\cdot '+M1}, {id:'mb', side:true, tex:'=-3x-4'},
            {id:'k2', tex:'='+V(E)+'\\cdot\\left('+N('3')+'-3x'+N('-4')+'\\right)'},
            {id:'k3', check:true, tex:'='+V(E)+'\\cdot\\left(-3x'+N('-1')+'\\right)'}]},

 {part:'Zweite Ableitung', cap:'Für $f\'\'$ leitest du $f\'$ wieder mit der Produktregel ab. Das neue $u$ ist die Klammer, $v$ bleibt $e^{-x}$.',
  rows:()=>[{id:'g', tex:"f'(x)="+T('gv',V(E))+'\\cdot '+T('gu',U('(-3x-1)'))},
            {id:'uv2', tex:'u(x)='+T('u',U('-3x-1'))+'\\qquad v(x)='+T('v',V(E))}],
  fly:[{from:'gu',to:'u',tex:()=>U('-3x-1')},{from:'gv',to:'v',tex:()=>V(E)}]},
 {part:'Zweite Ableitung', cap:'Ableiten: $u\'=-3$. Die Ableitung $v\'$ ist dieselbe wie eben, also $(-1)\\cdot e^{-x}$.',
  rows:()=>[{id:'g', tex:"f'(x)="+V(E)+'\\cdot '+U('(-3x-1)')},
            {id:'uv2', tex:'u(x)='+T('u',U('-3x-1'))+'\\qquad v(x)='+T('v',V(E))},
            {id:'d2', tex:"u'(x)="+T('up',U('-3'))+"\\qquad v'(x)="+T('vp',M1+'\\cdot '+V(E))}]},
 {part:'Zweite Ableitung', cap:'Setz in die Produktregel $u\'\\cdot v+u\\cdot v\'$ ein.',
  rows:()=>[{id:'g', tex:"f'(x)="+V(E)+'\\cdot '+U('(-3x-1)')},
            {id:'uv2', tex:'u(x)='+T('u',U('-3x-1'))+'\\qquad v(x)='+T('v',V(E))},
            {id:'d2', tex:"u'(x)="+T('up',U('-3'))+"\\qquad v'(x)="+T('vp',M1+'\\cdot '+V(E))},
            {id:'p2', tex:"f''(x)="+T('a',U('-3'))+'\\cdot '+T('b',V(E))+'+'+T('c',U('(-3x-1)'))+'\\cdot '+T('dd',M1+'\\cdot '+V(E))}],
  fly:[{from:'up',to:'a',tex:()=>U('-3')},{from:'v',to:'b',tex:()=>V(E)},{from:'u',to:'c',tex:()=>U('(-3x-1)')},{from:'vp',to:'dd',tex:()=>M1+'\\cdot '+V(E)}]},
 {part:'Zweite Ableitung', cap:'Wieder steckt $e^{-x}$ in beiden Summanden.',
  rows:()=>[{id:'g', tex:"f'(x)="+V(E)+'\\cdot '+U('(-3x-1)')},
            {id:'uv2', tex:'u(x)='+U('-3x-1')+'\\qquad v(x)='+V(E)},
            {id:'d2', tex:"u'(x)="+U('-3')+"\\qquad v'(x)="+M1+'\\cdot '+V(E)},
            {id:'p2', tex:"f''(x)="+T('s1',U('-3'))+'\\cdot '+T('e1',HL(V(E)))+'+'+T('s2',U('(-3x-1)')+'\\cdot '+M1)+'\\cdot '+T('e2',HL(V(E)))}]},
 {part:'Zweite Ableitung', cap:'Klammere $e^{-x}$ aus. In die Klammer kommt, was von jedem Summanden übrig bleibt.',
  rows:()=>[{id:'g', tex:"f'(x)="+V(E)+'\\cdot '+U('(-3x-1)')},
            {id:'uv2', tex:'u(x)='+U('-3x-1')+'\\qquad v(x)='+V(E)},
            {id:'d2', tex:"u'(x)="+U('-3')+"\\qquad v'(x)="+M1+'\\cdot '+V(E)},
            {id:'p2', tex:"f''(x)="+T('s1',U('-3'))+'\\cdot '+T('e1',HL(V(E)))+'+'+T('s2',U('(-3x-1)')+'\\cdot '+M1)+'\\cdot '+T('e2',HL(V(E)))},
            {id:'k21', tex:'='+T('E',HL(V(E)))+'\\cdot\\left('+T('r1',U('-3'))+'+'+T('r2',U('(-3x-1)')+'\\cdot '+M1)+'\\right)'}],
  fly:[{from:'e1',to:'E',tex:()=>HL(V(E))},{from:'e2',to:'E',tex:()=>HL(V(E))},{from:'s1',to:'r1',tex:()=>U('-3')},{from:'s2',to:'r2',tex:()=>U('(-3x-1)')+'\\cdot '+M1}]},
 {part:'Zweite Ableitung', cap:'Den Teil unter der Klammer rechnest du wieder in einer Nebenrechnung aus.',
  rows:()=>[P2(), K2()]},
 {part:'Zweite Ableitung', cap:'Multipliziere aus: Jeder Summand in der Klammer wird mit $(-1)$ multipliziert.',
  rows:()=>[P2(), K2(), {id:'ma2', side:true, label:true, tex:'=-3x\\cdot '+M1+'+(-1)\\cdot '+M1}]},
 {part:'Zweite Ableitung', cap:'Mal $(-1)$ dreht das Vorzeichen um: aus $-3x$ wird $3x$, aus $-1$ wird $1$.',
  rows:()=>[P2(), K2(), {id:'ma2', side:true, label:true, tex:'=-3x\\cdot '+M1+'+(-1)\\cdot '+M1}, {id:'mb2', side:true, tex:'='+T('m1','3x+1')}]},
 {part:'Zweite Ableitung', cap:'Setz das Ergebnis in die Klammer ein.',
  rows:()=>[P2(), K2(), {id:'ma2', side:true, label:true, tex:'=-3x\\cdot '+M1+'+(-1)\\cdot '+M1}, {id:'mb2', side:true, tex:'='+T('m1','3x+1')},
            {id:'k22', tex:'='+V(E)+'\\cdot\\left(-3+'+T('m2','3x+1')+'\\right)'}],
  fly:[{from:'m1',to:'m2',tex:()=>'3x+1'}]},
 {part:'Zweite Ableitung', cap:'Fasse zusammen: $-3+1=-2$. Damit ist $f\'\'(x)=e^{-x}\\cdot(3x-2)$.',
  rows:()=>[P2(), K2(), {id:'ma2', side:true, label:true, tex:'=-3x\\cdot '+M1+'+(-1)\\cdot '+M1}, {id:'mb2', side:true, tex:'=3x+1'},
            {id:'k22', tex:'='+V(E)+'\\cdot\\left('+N('-3')+'+3x'+N('+1')+'\\right)'},
            {id:'k23', tex:'='+V(E)+'\\cdot\\left(3x'+N('-2')+'\\right)'}]}
];

/* ================= Tafel ================= */
const $=id=>document.getElementById(id);
const board=$('board');
let mathReady=false, cur=0, busy=false, token=0;
const reduce=()=>window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function svg(tex){ return MathJax.tex2svg(tex,{display:false}); }
function setRow(el, r){
  el.className='row'+(r.side?' side':'')+(r.small?' small':'');
  el.replaceChildren();
  if(r.label){ const l=document.createElement('span'); l.className='lbl'; l.textContent='Nebenrechnung'; el.append(l); }
  el.append(svg(r.tex)); el.dataset.tex=r.tex;
  if(r.check){
    const c=document.createElementNS('http://www.w3.org/2000/svg','svg'); c.setAttribute('viewBox','0 0 24 24'); c.setAttribute('class','check'+(r.draw?' draw':''));
    c.setAttribute('role','img'); c.setAttribute('aria-label','fertig');
    const p=document.createElementNS('http://www.w3.org/2000/svg','path'); p.setAttribute('d','M4 12.5l5 5L20 6.5'); c.append(p); el.append(c);
  }
}
function rich(el, s){
  el.replaceChildren();
  s.split('$').forEach((part,i)=>{ if(!part) return; if(i%2) el.append(svg(part)); else el.append(document.createTextNode(part)); });
}
/* Nebenrechnung beginnt unter der geschweiften Klammer der Zeile darüber */
function alignSides(){
  let group=[], ub=null;
  const flush=()=>{
    if(!group.length) return;
    group.forEach(el=>el.style.paddingLeft='');
    if(ub){
      const base=group[0].getBoundingClientRect().left;
      const off=ub.getBoundingClientRect().left-base;
      const need=Math.max(...group.map(el=>Math.max(...[...el.children].map(c=>c.getBoundingClientRect().width))));
      const room=group[0].clientWidth-need-4;
      const pad=Math.max(8, Math.min(off, room))+'px';
      group.forEach(el=>el.style.paddingLeft=pad);
    }
    group=[];
  };
  rowsOf().forEach(el=>{
    if(el.classList.contains('side')) group.push(el);
    else { flush(); ub=el.querySelector('.t-ub'); }
  });
  flush();
}
const rowsOf=()=>[...board.querySelectorAll(':scope > .row')];
const find=n=>board.querySelector('.row .t-'+n);

/* Ohne Animation: Tafel direkt auf den Stand von Schritt i bringen */
function paint(i){
  readColors();
  board.querySelectorAll('.flyer').forEach(f=>f.remove());
  board.replaceChildren();
  STEPS[i].rows().forEach(r=>{ const el=document.createElement('div'); el.dataset.id=r.id; setRow(el,r); board.append(el); });
  alignSides();
  ui(i);
}
/* Erklärung: alte verschwindet, nach einer halben Sekunde springt die neue auf */
let capTok=0;
function setCap(i, pop){
  const el=$('caption'), my=++capTok;
  el.getAnimations().forEach(a=>a.cancel());
  if(!pop || reduce()){ rich(el, STEPS[i].cap); el.style.opacity=''; el.style.transform=''; return; }
  el.animate([{opacity:1,transform:'scale(1)'},{opacity:0,transform:'scale(.9)'}],{duration:220,easing:'ease-in',fill:'forwards'});
  setTimeout(()=>{
    if(my!==capTok) return;
    rich(el, STEPS[i].cap);
    el.animate([{opacity:0,transform:'scale(.55)'},{opacity:1,transform:'scale(1.12)',offset:.6},{opacity:1,transform:'scale(1)'}],
      {duration:600,easing:'ease-out',fill:'forwards'});
  },500);
}
function ui(i, pop){
  $('part').textContent=STEPS[i].part;
  setCap(i, pop);
  $('count').textContent='Schritt '+(i+1)+' von '+STEPS.length;
  $('prevBtn').disabled=i===0;
  $('nextBtn').textContent= i===STEPS.length-1 ? 'Von vorn' : 'Weiter';
}
const wait=ms=>new Promise(r=>setTimeout(r,ms));

/* Mit Animation von Schritt i-1 nach i */
async function animateTo(i){
  const my=++token; busy=true; readColors();
  const st=STEPS[i], rows=st.rows(), keep=new Set(rows.map(r=>r.id));
  const old=new Map(rowsOf().map(el=>[el.dataset.id, el]));
  // 1. Zeilen, die wegfallen, ausblenden
  const gone=[...old].filter(([id])=>!keep.has(id)).map(([,el])=>el);
  if(gone.length){
    await Promise.all(gone.map(el=>el.animate([{opacity:1},{opacity:0}],{duration:280,fill:'forwards'}).finished));
    if(my!==token) return; gone.forEach(el=>el.remove());
  }
  // 2. Zeilen in neuer Reihenfolge, geänderte neu setzen, neue einblenden
  const added=[], changed=[];
  rows.forEach(r=>{
    let el=old.get(r.id);
    if(el && el.isConnected){ if(el.dataset.tex!==r.tex){ setRow(el,r); changed.push(el); } }
    else { el=document.createElement('div'); el.dataset.id=r.id; setRow(el,{...r, draw:true}); added.push(el); }
    board.append(el);
  });
  ui(i, true); alignSides();
  const fly=st.fly||[];
  const targets=fly.map(f=>find(f.to)).filter(Boolean);
  targets.forEach(t=>t.style.opacity='0');
  added.forEach(el=>el.animate([{opacity:0},{opacity:1}],{duration:380,easing:'ease-out'}));
  changed.forEach(el=>el.animate([{opacity:.35},{opacity:1}],{duration:420,easing:'ease-out'}));
  // 3. Teilterme fliegen lassen
  if(fly.length){
    await wait(320); if(my!==token) return;
    const b=board.getBoundingClientRect();
    await Promise.all(fly.map((f,k)=>{
      const src=find(f.from), dst=find(f.to); if(!src||!dst) return Promise.resolve();
      const fr=src.getBoundingClientRect(), tr=dst.getBoundingClientRect();
      const d=document.createElement('div'); d.className='flyer'; d.append(svg(f.tex())); board.append(d);
      const r=d.getBoundingClientRect();
      const x0=fr.left-b.left, y0=fr.top-b.top+fr.height/2-r.height/2;
      const x1=tr.left-b.left, y1=tr.top-b.top+tr.height/2-r.height/2;
      d.style.transform='translate('+x0+'px,'+y0+'px)';
      return d.animate([{transform:'translate('+x0+'px,'+y0+'px)'},{transform:'translate('+x1+'px,'+y1+'px)'}],
        {duration:820, delay:k*170, easing:'cubic-bezier(.45,0,.2,1)', fill:'forwards'}).finished
        .then(()=>{ dst.style.opacity=''; d.remove(); }).catch(()=>{});
    }));
  }
  if(my===token) busy=false;
}

function go(i, animate){
  if(i<0 || i>=STEPS.length) return;
  const from=cur; cur=i;
  if(!mathReady){ return; }
  if(animate && !reduce() && i===from+1 && !busy) animateTo(i);
  else { token++; busy=false; paint(i); }
}
$('nextBtn').addEventListener('click',()=>{ if(cur===STEPS.length-1) go(0,false); else go(cur+1,true); });
$('prevBtn').addEventListener('click',()=>go(cur-1,false));
$('replayBtn').addEventListener('click',()=>{ if(cur===0){ paint(0); return; } token++; busy=false; paint(cur-1); cur=cur-1; go(cur+1,true); });
document.addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  if(e.key==='ArrowRight'||e.key===' '){ e.preventDefault(); $('nextBtn').click(); }
  else if(e.key==='ArrowLeft'){ e.preventDefault(); go(cur-1,false); }
});
/* Bei Wechsel zwischen hell und dunkel die Markierungsfarbe neu setzen */
try{ window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{ if(mathReady){ token++; busy=false; paint(cur); } }); }catch(e){}
new MutationObserver(()=>{ if(mathReady){ token++; busy=false; paint(cur); } }).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

window.addEventListener('resize',()=>{ if(mathReady) alignSides(); });
function onMathReady(){
  if(mathReady) return;
  mathReady=true;
  try{ document.head.appendChild(MathJax.svgStylesheet()); }catch(e){}
  paint(cur);
}
document.documentElement.lang='de';
window.onMathReady=onMathReady;
$('caption').textContent='Die Formeln werden geladen.';
if(window.__mjReady) onMathReady();
</script>
